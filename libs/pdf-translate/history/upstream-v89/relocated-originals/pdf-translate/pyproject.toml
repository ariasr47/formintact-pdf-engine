[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-translate"
version = "89.0.0"
description = "Layout-faithful PDF translation with working form fields"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
authors = [{name = "Rodrigo Arias"}]
dependencies = [
    "pymupdf>=1.24,<1.30",
    "pikepdf>=8.0,<11",
    "fonttools>=4.40,<5",
]

[tool.setuptools]
packages = ["pdf_translate"]
