[project]
name = "pdft-engine-contract"
version = "0.1.0"
description = "Automatically generated by Nx."
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.7,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["pdft_engine_contract"]

[dependency-groups]
dev = [
  "pytest>=8",
  "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
